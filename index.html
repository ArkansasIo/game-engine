<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BitForge 8 Engine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="src/css/editor.css">
</head>
<body>
<div id="app">
  <header id="menubar">
    <div class="logo"><i></i>BITFORGE 8</div>
    <div class="menu" data-menu="file"><button>File</button><div class="menu-items">
      <button data-cmd="new">New Project</button>
      <button data-cmd="open">Open Project… <kbd>.json</kbd></button>
      <button data-cmd="save">Save Project <kbd>Ctrl+S</kbd></button>
      <button data-cmd="export">Package Game… <kbd>.html</kbd></button>
    </div></div>
    <div class="menu" data-menu="edit"><button>Edit</button><div class="menu-items">
      <button data-cmd="undo">Undo <kbd>Ctrl+Z</kbd></button>
      <button data-cmd="redo">Redo <kbd>Ctrl+Y</kbd></button>
      <button data-cmd="dup">Duplicate Actor <kbd>Ctrl+D</kbd></button>
      <button data-cmd="del">Delete Actor <kbd>Del</kbd></button>
    </div></div>
    <div class="menu" data-menu="window"><button>Window</button><div class="menu-items">
      <button data-cmd="tab-viewport">Viewport</button>
      <button data-cmd="tab-sprite">Sprite Editor</button>
      <button data-cmd="tab-sound">Sound Editor</button>
      <button data-cmd="tab-blueprint">Blueprint Editor</button>
      <button data-cmd="tab-database">Database <kbd>F9</kbd></button>
    </div></div>
    <div class="menu" data-menu="help"><button>Help</button><div class="menu-items">
      <button data-cmd="help">Shortcuts &amp; Quick Start</button>
    </div></div>
    <span id="projname"></span><span id="savestate"></span>
  </header>

  <div id="toolbar">
    <button id="t-select" title="Select / Move (Q)">⬚ Select</button>
    <button id="t-paint" title="Paint tiles (B)">✎ Paint</button>
    <button id="t-erase" title="Erase tiles (E)">⌫ Erase</button>
    <div class="sep"></div>
    <button id="t-snap" title="Snap actors to 8px grid">⊞ Snap</button>
    <button id="t-grid" title="Toggle grid (G)">▦ Grid</button>
    <div class="sep"></div>
    <span class="tb-label">Level</span><select id="t-level"></select>
    <div class="sep"></div>
    <button id="btn-db" title="Open the game Database (F9)">🗃 Database</button>
    <div style="flex:1"></div>
    <button id="btn-play" title="Play In Editor (Alt+P)">▶ Play</button>
    <button id="btn-stop" title="Stop (Esc)" disabled>■ Stop</button>
    <div class="sep"></div>
    <button id="btn-export" title="Export a standalone game .html">📦 Package Game</button>
  </div>

  <div id="main">
    <aside id="left">
      <div class="panel" style="flex:1.4">
        <div class="panel-h">Place Actors</div>
        <div class="panel-b" id="place"></div>
      </div>
      <div class="panel" style="flex:1">
        <div class="panel-h">Levels<div class="r"><button id="lv-add" title="Add level">+</button><button id="lv-dup" title="Duplicate level">⧉</button><button id="lv-del" title="Delete level">🗑</button></div></div>
        <div class="panel-b" id="levels"></div>
      </div>
    </aside>

    <section id="center">
      <div id="tabs"></div>
      <div id="tabbody">
        <div class="tabpage on" id="page-viewport">
          <canvas id="vp"></canvas>
          <div id="vp-hint"></div>
          <div id="vp-status"></div>
          <div id="pie"><div class="screen" id="pie-screen"></div><div class="pie-note">PLAYING — Enter command · I bag · C character · K spells · L quests · M map · Esc game menu · Shift+Esc stop</div></div>
        </div>
        <div class="tabpage" id="page-blueprint">
          <div class="bp-side">
            <div class="panel-h">Blueprint: <span id="bp-title"></span></div>
            <input type="text" id="bp-search" placeholder="Search nodes…">
            <div id="bp-palette"></div>
          </div>
          <div id="bp-graph">
            <div id="bp-layer"><svg id="bp-wires"></svg><div id="bp-nodes"></div></div>
            <div class="bp-empty" id="bp-empty"></div>
            <div class="bp-wm">BLUEPRINT</div>
          </div>
        </div>
        <div class="tabpage" id="page-sprite"><div class="ed-wrap" id="se-wrap"></div></div>
        <div class="tabpage" id="page-sound"><div class="ed-wrap" id="snd-wrap"></div></div>
        <div class="tabpage" id="page-database"></div>
      </div>
    </section>

    <aside id="right">
      <div class="panel" style="flex:1">
        <div class="panel-h">Outliner <span class="muted" id="ol-count" style="text-transform:none;font-weight:400"></span></div>
        <div class="panel-b" id="outliner"></div>
      </div>
      <div class="panel" style="flex:1.6;border-top:1px solid var(--line)">
        <div class="panel-h" id="det-h">Details</div>
        <div class="panel-b" id="details"></div>
      </div>
    </aside>
  </div>

  <footer id="drawer">
    <div id="drawer-tabs">
      <button class="dt on" data-dt="sprites">🧱 Sprites &amp; Tiles</button>
      <button class="dt" data-dt="sounds">🔊 Sounds</button>
      <button class="dt" data-dt="log">📜 Output Log</button>
      <div class="r" id="drawer-actions"></div>
    </div>
    <div id="drawer-b"></div>
  </footer>
</div>
<div id="modal"><div class="box" id="modal-box"></div></div>
<input type="file" id="file-open" accept=".json,application/json" hidden>

<!-- ===================================================================== -->
<!-- RUNTIME: self-contained. Also embedded verbatim in packaged games.     -->
<!-- ===================================================================== -->

<!-- BUILD:SCRIPTS -->
<script src="src/runtime/runtime.js"></script>
<script src="src/editor/util.js"></script>
<script src="src/editor/nodes.js"></script>
<script src="src/editor/default-project.js"></script>
<script src="src/editor/database.js"></script>
<script src="src/editor/state.js"></script>
<script src="src/editor/tabs.js"></script>
<script src="src/editor/panels.js"></script>
<script src="src/editor/details.js"></script>
<script src="src/editor/drawer.js"></script>
<script src="src/editor/tools.js"></script>
<script src="src/editor/viewport.js"></script>
<script src="src/editor/play.js"></script>
<script src="src/editor/blueprint.js"></script>
<script src="src/editor/sprite-editor.js"></script>
<script src="src/editor/sound-editor.js"></script>
<script src="src/editor/files.js"></script>
<script src="src/editor/commands.js"></script>
<script src="src/editor/main.js"></script>
</body>
</html>
